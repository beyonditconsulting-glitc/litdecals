name: Check browser login behavior
on:
  push:
    branches: [main]
    paths: ['.github/workflows/audit-resources.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verify password protection and successful navigation responses
        env:
          BASIC_USER: ${{ secrets.LITDECALS_BASIC_USER }}
          BASIC_PASSWORD: ${{ secrets.LITDECALS_BASIC_PASSWORD }}
        shell: python
        run: |
          import base64, os, urllib.request, urllib.error
          origin="https://litdecals.com/sandbox-redesign/"
          auth=base64.b64encode((os.environ["BASIC_USER"]+":"+os.environ["BASIC_PASSWORD"]).encode()).decode()
          print("::add-mask::"+auth)
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl): return None
          opener=urllib.request.build_opener(NoRedirect())
          for authenticated,path in ((False,"shop/"),(True,""),(True,"shop/"),(True,"shop/"),(True,"arrma-mafia-shop/"),(True,"wp-json/wc/store/v1/products?per_page=1")):
              headers={"Cache-Control":"no-cache"}
              if authenticated: headers["Authorization"]="Basic "+auth
              req=urllib.request.Request(origin+path,headers=headers)
              try:
                  with opener.open(req,timeout=35) as response:
                      challenge=response.headers.get("WWW-Authenticate","")
                      print({"path":path,"authenticated":authenticated,"status":response.status,
                             "has_auth_challenge":bool(challenge),"challenge":challenge})
              except urllib.error.HTTPError as error:
                  challenge=error.headers.get("WWW-Authenticate","")
                  print({"path":path,"authenticated":authenticated,"status":error.code,
                         "has_auth_challenge":bool(challenge),"challenge":challenge})
