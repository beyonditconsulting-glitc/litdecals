name: Audit sandbox page resources
on:
  push:
    branches: [main]
    paths: ['.github/workflows/audit-resources.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check for resources that trigger another login
        env:
          BASIC_USER: ${{ secrets.LITDECALS_BASIC_USER }}
          BASIC_PASSWORD: ${{ secrets.LITDECALS_BASIC_PASSWORD }}
        shell: python
        run: |
          import base64, os, urllib.request, urllib.error, urllib.parse, concurrent.futures
          from html.parser import HTMLParser
          origin="https://litdecals.com/sandbox-redesign/"
          auth=base64.b64encode((os.environ["BASIC_USER"]+":"+os.environ["BASIC_PASSWORD"]).encode()).decode()
          print("::add-mask::"+auth)
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl): return None
          opener=urllib.request.build_opener(NoRedirect())
          class Resources(HTMLParser):
              def __init__(self): super().__init__(); self.urls=set()
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if tag in ("img","script","iframe") and a.get("src"): self.urls.add(urllib.parse.urljoin(origin,a["src"]))
                  if tag=="link" and a.get("rel") in ("stylesheet","preload","icon"): self.urls.add(urllib.parse.urljoin(origin,a.get("href","")))
          def fetch(url, read_body=False):
              headers={"Cache-Control":"no-cache"}
              if url.startswith(origin): headers["Authorization"]="Basic "+auth
              try:
                  with opener.open(urllib.request.Request(url,headers=headers),timeout=25) as response:
                      body=response.read(4000000) if read_body else b""
                      return response.status, "", bool(response.headers.get("WWW-Authenticate")), body
              except urllib.error.HTTPError as error:
                  return error.code,error.headers.get("Location",""),bool(error.headers.get("WWW-Authenticate")),b""
              except Exception:
                  return "network-error","",False,b""
          urls=set()
          for path in ("","shop/","arrma-mafia-shop/"):
              status,location,challenge,body=fetch(origin+path,True)
              parser=Resources();parser.feed(body.decode("utf-8","replace"));urls.update(parser.urls)
              print({"page":path,"status":status,"redirect":location,"challenge":challenge})
          urls=sorted(url for url in urls if urllib.parse.urlsplit(url).hostname in ("litdecals.com","www.litdecals.com"))
          def check(url):
              status,location,challenge,_=fetch(url)
              return {"resource":url,"status":status,"redirect":location,"challenge":challenge}
          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as pool:
              results=list(pool.map(check,urls))
          problems=[r for r in results if r["status"]!=200 or r["challenge"]]
          print({"resources_checked":len(results),"failed_resources":[r for r in problems if r["status"]!=200],"successful_challenge_headers":sum(1 for r in results if r["status"]==200 and r["challenge"])})
          import re
          for path in ("wp-content/plugins/woocommerce/assets/client/blocks/wc-blocks-middleware.js", "wp-content/plugins/woocommerce/assets/client/blocks/wc-blocks-data.js", "wp-includes/js/dist/api-fetch.min.js"):
              status,_,_,body=fetch(origin+path,True)
              code=body.decode("utf-8","replace")
              snippets=[code[max(0,m.start()-100):m.end()+150] for m in re.finditer("credentials",code)]
              print({"script":path,"status":status,"credential_options":snippets[:12]})

          class ProductStructure(HTMLParser):
              def __init__(self): super().__init__(); self.stack=[]; self.current=None; self.entries=[]
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if tag=="body": print({"body_classes":a.get("class","")})
                  if tag=="a" and "/product/" in a.get("href",""):
                      self.current={"href":a["href"],"parents":self.stack[-5:],"text":[]}
                  if tag not in ("img","input","meta","link","br","hr","source","wbr"):
                      self.stack.append((tag,a.get("class",""),a.get("id","")))
              def handle_data(self,text):
                  if self.current is not None: self.current["text"].append(text)
              def handle_endtag(self,tag):
                  if tag=="a" and self.current is not None:
                      self.current["text"]=" ".join("".join(self.current["text"]).split())
                      if self.current["text"]: self.entries.append(self.current)
                      self.current=None
                  for i in range(len(self.stack)-1,-1,-1):
                      if self.stack[i][0]==tag:
                          self.stack=self.stack[:i];break
          _,_,_,body=fetch(origin+"arrma-mafia-shop/?inspect=structure",True)
          structure=ProductStructure();structure.feed(body.decode("utf-8","replace"))
          print({"product_structure":structure.entries[:8]})
