name: Review catalog destinations
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/review-catalog.yml']
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check the current shop and full-product destinations
        env:
          BASIC_USER: ${{ secrets.LITDECALS_BASIC_USER }}
          BASIC_PASSWORD: ${{ secrets.LITDECALS_BASIC_PASSWORD }}
        shell: python
        run: |
          import base64, os, urllib.request, urllib.error, re, html
          from html.parser import HTMLParser
          auth = base64.b64encode((os.environ["BASIC_USER"] + ":" + os.environ["BASIC_PASSWORD"]).encode()).decode()
          print("::add-mask::" + auth)
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          opener = urllib.request.build_opener(NoRedirect())
          origin = "https://litdecals.com/sandbox-redesign/"
          for path in ("shop/", "wp-json/wc/store/v1/cart", "wp-json/wc/store/v1/products?per_page=1", "?wc-ajax=get_refreshed_fragments"):
              req = urllib.request.Request(origin + path, headers={"Authorization":"Basic " + auth, "Cache-Control":"no-cache"})
              try:
                  with opener.open(req, timeout=45) as response:
                      body = response.read(4000000).decode("utf-8", "replace")
                      titles = [html.unescape(re.sub("<[^>]*>", "", x)).strip() for x in re.findall(r"<h1\b[^>]*>(.*?)</h1>", body, re.S|re.I)]
                      links = re.findall(r'<a\b[^>]*href=["\x27]([^"\x27]+)["\x27][^>]*>\s*(Browse all products|View the full catalog)', body, re.I)
                      results = [html.unescape(re.sub("<[^>]*>", "", x)).strip() for x in re.findall(r'<p\b[^>]*class=["\x27][^"\x27]*woocommerce-result-count[^"\x27]*["\x27][^>]*>(.*?)</p>', body, re.S|re.I)]
                      names = [html.unescape(re.sub("<[^>]*>", "", x)).strip() for x in re.findall(r'<h[23]\b[^>]*class=["\x27][^"\x27]*woocommerce-loop-product__title[^"\x27]*["\x27][^>]*>(.*?)</h[23]>', body, re.S|re.I)]
                      print({"results":results,"product_names":names})
                      print({"path":path,"status":response.status,"headings":titles[:4],"catalog_links":links,
                             "woo_product_titles":body.count("woocommerce-loop-product__title"),
                             "home_product_cards":body.count('class="litrd-product"'),
                             "contains_no_results":"No products were found" in body})
              except urllib.error.HTTPError as error:
                  try:
                      error_body = __import__("json").loads(error.read(65536))
                      error_code = error_body.get("code", "unknown")
                  except (ValueError, AttributeError):
                      error_code = "non-json"
                  known = {"incorrect_password", "rest_not_logged_in", "woocommerce_rest_authentication_error", "rest_no_route"}
                  print({"path":path,"status":error.code,"redirect":error.headers.get("Location",""),
                         "auth_challenge":bool(error.headers.get("WWW-Authenticate")),
                         "error_category":error_code if error_code in known else "other"})
