name: Inspect header spacing
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/review-catalog.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Read theme header spacing rules and rendered header structure
        env:
          BASIC_USER: ${{ secrets.LITDECALS_BASIC_USER }}
          BASIC_PASSWORD: ${{ secrets.LITDECALS_BASIC_PASSWORD }}
        shell: python
        run: |
          import base64,os,urllib.request,re,json
          origin="https://litdecals.com/sandbox-redesign/"
          auth=base64.b64encode((os.environ["BASIC_USER"]+":"+os.environ["BASIC_PASSWORD"]).encode()).decode()
          print("::add-mask::"+auth)
          def get(path):
              req=urllib.request.Request(origin+path,headers={"Authorization":"Basic "+auth,"Cache-Control":"no-cache"})
              with urllib.request.urlopen(req,timeout=35) as response: return response.read(4000000).decode("utf-8","replace")
          for path in ("wp-content/themes/store-pro_OLD/style.css","wp-content/themes/store-pro_OLD/assets/theme-styles/css/default.css"):
              css=get(path)
              rules=[]
              for match in re.finditer(r"([^{}]+)[{]([^{}]*)[}]",css):
                  selector,body=match.groups()
                  if re.search(r"masthead|site-branding|top-search|site-navigation|site-header|text-title-desc|top-cart|slickmenu",selector):
                      rules.append({"selector":selector.strip(),"rules":body.strip()})
              print(json.dumps({"stylesheet":path,"rules":rules[:120]}))
          page=get("?inspect_header_spacing=1")
          header=re.search(r"<header[^>]*>.*?</header>",page,re.S)
          if header: print("HEADER_STRUCTURE: "+re.sub(r"(src|href)=[\"'][^\"']+[\"']","resource",header.group())[:18000])
