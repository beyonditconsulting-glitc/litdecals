name: Check LitDecals Sandbox connection
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/check-sandbox.yml'
permissions:
  contents: read
jobs:
  check-connection:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify sandbox authentication without changing the site
        env:
          BASIC_USER: ${{ secrets.LITDECALS_BASIC_USER }}
          BASIC_PASSWORD: ${{ secrets.LITDECALS_BASIC_PASSWORD }}
          WP_APP_PASSWORD: ${{ secrets.ITDECALS_WP_APP_PASSWORD || secrets.LITDECALS_WP_APP_PASSWORD }}
        shell: python
        run: |
          import base64, json, os, sys, urllib.request, urllib.error
          values = {key: os.environ.get(key, "").strip() for key in
                    ("BASIC_USER", "BASIC_PASSWORD", "WP_APP_PASSWORD")}
          if not all(values.values()):
              sys.exit("A required repository secret is missing or empty.")
          basic = base64.b64encode(
              (values["BASIC_USER"] + ":" + values["BASIC_PASSWORD"]).encode()).decode()
          wordpress = base64.b64encode(
              ("litdecals:" + values["WP_APP_PASSWORD"]).encode()).decode()
          for value in (basic, wordpress):
              print("::add-mask::" + value)
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          opener = urllib.request.build_opener(NoRedirect())
          front_request = urllib.request.Request(
              "https://litdecals.com/sandbox-redesign/",
              headers={"Authorization": "Basic " + basic,
                       "User-Agent": "LitDecals-Sandbox-Connection-Check/1.0"},
              method="GET")
          try:
              with opener.open(front_request, timeout=45) as response:
                  response.read(1)
                  print("Browser login passed: HTTP " + str(response.status))
          except urllib.error.HTTPError as error:
              sys.exit("Browser login failed: HTTP " + str(error.code) +
                       ". Check LITDECALS_BASIC_USER and LITDECALS_BASIC_PASSWORD.")
          except (urllib.error.URLError, TimeoutError):
              sys.exit("Could not reach the sandbox homepage.")
          request = urllib.request.Request(
              "https://litdecals.com/sandbox-redesign/wp-json/litdecals-sandbox/v1/status",
              headers={"Authorization": "Basic " + basic,
                       "X-LitDecals-Authorization": "Basic " + wordpress,
                       "Accept": "application/json",
                       "User-Agent": "LitDecals-Sandbox-Connection-Check/1.0"},
              method="GET")
          try:
              with opener.open(request, timeout=45) as response:
                  data = json.loads(response.read(1048576))
                  if response.status != 200 or not isinstance(data, dict):
                      sys.exit("The connector returned an unexpected response.")
          except urllib.error.HTTPError as error:
              try:
                  code = json.loads(error.read(1048576)).get("code")
              except (ValueError, AttributeError):
                  code = None
              known_codes = {"invalid_auth", "incorrect_password", "invalid_username",
                             "application_passwords_disabled", "application_passwords_disabled_for_user",
                             "rest_not_logged_in", "admin_required", "sandbox_only",
                             "https_required", "rest_no_route"}
              print("WordPress error category: " + (code if code in known_codes else "unclassified"))
              sys.exit("Sandbox authentication check failed: HTTP " + str(error.code) +
                       ". No site files were changed.")
          except (urllib.error.URLError, ValueError, TimeoutError):
              sys.exit("Could not verify the sandbox connector. No site files were changed.")
          print("Status field names: " + ", ".join(sorted(data.keys())))
          namespace_request = urllib.request.Request(
              "https://litdecals.com/sandbox-redesign/wp-json/litdecals-sandbox/v1/deploy",
              headers={"Authorization": "Basic " + basic,
                       "X-LitDecals-Authorization": "Basic " + wordpress,
                       "Accept": "application/json"}, method="OPTIONS")
          with opener.open(namespace_request, timeout=45) as response:
              schema = json.loads(response.read(1048576))
          for route, info in schema.get("routes", {"/litdecals-sandbox/v1/deploy": schema}).items():
              if route.startswith("/litdecals-sandbox/v1/"):
                  for endpoint in info.get("endpoints", []):
                      args = endpoint.get("args", {})
                      print("Route schema: " + json.dumps({"route": route,
                            "methods": endpoint.get("methods", []),
                            "args": {key: {"type": value.get("type"),
                                     "required": value.get("required", False)}
                                     for key, value in args.items()}}))
          print("SUCCESS: Sandbox connector returned authenticated JSON with HTTP 200.")
          print("This check used GET only; no site files were changed.")
