name: Publish LitDecals Sandbox
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'storefront/**'
      - 'scripts/publish-sandbox.py'
      - 'scripts/test-header.php'
      - 'scripts/test-mobile.cjs'
      - 'scripts/test-products.cjs'
      - 'scripts/test-mafia.php'
      - '.github/workflows/publish-sandbox.yml'
permissions:
  contents: read
concurrency:
  group: litdecals-sandbox-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install the pinned DOM test dependency
        run: npm install --prefix "$RUNNER_TEMP/litdecals-dom" --ignore-scripts --no-package-lock linkedom@0.18.12
      - name: Validate source and mobile behavior
        env:
          LITDECALS_DOM_MODULE: ${{ runner.temp }}/litdecals-dom/node_modules/linkedom
        run: |
          php -l storefront/litdecals-storefront.php
          php -l storefront/home.php
          php scripts/test-header.php
          php scripts/test-mafia.php
          node --check storefront/storefront.js
          node scripts/test-mobile.cjs
          node scripts/test-products.cjs
          python3 -m py_compile scripts/publish-sandbox.py
      - name: Publish and verify the sandbox header
        env:
          BASIC_USER: ${{ secrets.LITDECALS_BASIC_USER }}
          BASIC_PASSWORD: ${{ secrets.LITDECALS_BASIC_PASSWORD }}
          WP_APP_PASSWORD: ${{ secrets.ITDECALS_WP_APP_PASSWORD || secrets.LITDECALS_WP_APP_PASSWORD }}
        run: python3 scripts/publish-sandbox.py
